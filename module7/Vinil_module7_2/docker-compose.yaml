services:

  # --------------------------------
  # Ollama service
  # --------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # --------------------------------
  # Python Streamlit application
  # --------------------------------
  app:
    build: .
    container_name: streamlit_app
    ports:
      - "8501:8501"
    depends_on:
      - ollama

# --------------------------------
# Persistent storage for Ollama
# --------------------------------
volumes:
  ollama_data: