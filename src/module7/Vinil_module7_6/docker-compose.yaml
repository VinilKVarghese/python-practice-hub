
services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  chat-app:
    build: .
    container_name: ollama-chat-app
    ports:
      - "8501:8501"
    environment:
      PERSONA_MODE: ${PERSONA_MODE:-false}
      OLLAMA_URL: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:3b}
    depends_on:
      - ollama

volumes:
  ollama_data: